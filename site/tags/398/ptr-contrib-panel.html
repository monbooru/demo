
<div class="ptr-contrib-card peer-accent">
  <div class="ptr-contrib-head">
    <span class="ptr-contrib-title">Public Tag Repository</span>
    <button type="button" class="btn-link-accent peer-accent btn-ptr-lookup"
            hx-get="/tags/398/ptr-lookup-dialog"
            hx-target="#ptr-contrib-dialog-host" hx-swap="innerHTML"
            hx-on::after-request="var d=document.getElementById('ptr-lookup-dialog'); if(d){d.showModal(); d.querySelector('#ptr-lookup-as').focus();} else htmx.trigger(document.body,'ptr-contrib-closed');">[look up as...]</button>
  </div>
  
  
  
  <div class="ptr-contrib-row">
    <div class="ptr-contrib-lines">
      <p><span class="ptr-contrib-minus">--</span> the Public Tag Repository holds <span class="ptr-count" title="school_desk =&gt; desk">1</span> relation for this tag not declared here.</p>
      
    </div>
    <div class="ptr-contrib-actions">
      
      <button type="button" class="btn-ptr-pull peer-accent"
              onclick="pullTagPTR('Pull aliases and implications', 'Pull the PTR aliases and implications for this tag?')">Pull aliases and implications</button>
      
      <button type="button" class="btn-ptr-contribute"
        disabled title="a contribution account in monloader is required to contribute">Contribute...</button>
    </div>
  </div>
</div>
