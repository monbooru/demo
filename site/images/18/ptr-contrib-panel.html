
<div class="ptr-contrib-card peer-accent">
  <div class="ptr-contrib-head">
    <span class="ptr-contrib-title">Public Tag Repository</span>
  </div>
  
  
  <div class="ptr-contrib-row">
    <div class="ptr-contrib-lines">
      <p><span class="ptr-contrib-minus">--</span> the Public Tag Repository holds <span class="ptr-count" title="looking_at_another
eyebrows_visible_through_hair
blue_vest
vest
blue_wristband
medium:typo
medium:text">7</span> tags this image does not carry.</p>
      
    </div>
    <div class="ptr-contrib-actions">
      
      <button type="button" class="btn-ptr-pull peer-accent"
              hx-post="/images/18/lookup" hx-vals='{"backend":"ptr"}'
              hx-target="#fetch-pending" hx-swap="innerHTML"
              hx-confirm="Pull this file's tags from the Public Tag Repository?"
              title="Add the tags it holds and record it as a source for the ones this image already carries"
              data-confirm-ok="Pull tags">Pull tags</button>
      
      <button type="button" class="btn-ptr-contribute"
        disabled title="a contribution account in monloader is required to contribute">Contribute...</button>
    </div>
  </div>
</div>
