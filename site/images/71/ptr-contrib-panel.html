
<div class="ptr-contrib-card peer-accent">
  <div class="ptr-contrib-head">
    <span class="ptr-contrib-title">Public Tag Repository</span>
  </div>
  
  
  <div class="ptr-contrib-row">
    <div class="ptr-contrib-lines">
      
      <ul>
        <li><span class="ptr-contrib-plus">++</span> <span class="ptr-count" title="character:kirisame_marisa_(witch_of_scarlet_dreams)">1</span> of this image's tags is new to the Public Tag Repository.</li>
        <li><span class="ptr-contrib-minus">--</span> the Public Tag Repository holds <span class="ptr-count" title="black_headwear
brown_headwear
pink_headwear
artist:zun_(artist)
asian">5</span> tags this image does not carry.</li>
      </ul>
      
    </div>
    <div class="ptr-contrib-actions">
      
      <button type="button" class="btn-ptr-pull peer-accent"
              hx-post="/images/71/lookup" hx-vals='{"backend":"ptr"}'

              hx-confirm="Pull this file's tags from the Public Tag Repository?"

      <button type="button" class="btn-ptr-contribute"
        disabled title="a contribution account in monloader is required to contribute">Contribute...</button>
    </div>
